<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330" viewBox="0 0 820 330" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b03a2e"/></marker></defs>
  <style>
    .k { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .y { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .u { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .g { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .n { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .w { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .d { fill: #ffffff; stroke: #666666; stroke-width: 1; stroke-dasharray: 4 3; }
    .ln { fill: none; stroke: #333333; stroke-width: 1.3; }
    .dl { fill: none; stroke: #666666; stroke-width: 1; stroke-dasharray: 4 3; }
    .lnr { fill: none; stroke: #b03a2e; stroke-width: 1.6; }
    .t { text-anchor: middle; }
    .e { text-anchor: end; }
    .b { font-weight: bold; }
    .s { font-size: 11px; fill: #444444; }
    .m { font-family: DejaVu Sans Mono, monospace; font-size: 11px; }
    .r { fill: #b03a2e; font-weight: bold; }
  </style>
  <rect width="820" height="330" fill="#ffffff"/>
  <text class="b" x="20" y="24">The first page of RAM</text>
  <rect class="n" x="20" y="36" width="210" height="62"/>
  <text class="t b" x="125" y="60">armstub8</text>
  <text class="t s" x="125" y="80">from address 0</text>
  <rect class="w" x="20" y="98" width="210" height="38"/>
  <text class="m" x="30" y="122">0xd8</text>
  <text class="s" x="84" y="122">core 0: not used</text>
  <rect class="w" x="20" y="136" width="210" height="38"/>
  <text class="m" x="30" y="160">0xe0</text>
  <text class="s" x="84" y="160">core 1: done</text>
  <rect class="y" x="20" y="174" width="210" height="38"/>
  <text class="m" x="30" y="198">0xe8</text>
  <text class="s" x="84" y="198">core 2: entry, now set</text>
  <rect class="w" x="20" y="212" width="210" height="38"/>
  <text class="m" x="30" y="236">0xf0</text>
  <text class="s" x="84" y="236">core 3: still 0</text>
  <rect class="u" x="360" y="150" width="160" height="86" rx="4"/>
  <text class="t b" x="440" y="176">core 0</text>
  <text class="t s" x="440" y="194">runs startup, calls</text>
  <text class="t m" x="440" y="212">release_cpu(2)</text>
  <path class="lnr" d="M358,193 L232,193" marker-end="url(#ar)"/>
  <text class="t s" x="295" y="172">1. writes entry</text>
  <text class="t s" x="295" y="186">then dsb sy</text>
  <text class="b" x="600" y="24">The other cores</text>
  <rect class="k" x="600" y="46" width="205" height="56" rx="4"/>
  <text class="b" x="612" y="68">core 1</text>
  <text class="s" x="612" y="88">already released: running</text>
  <rect class="g" x="600" y="126" width="205" height="56" rx="4"/>
  <text class="b" x="612" y="148">core 2, in wfe</text>
  <text class="s" x="612" y="168">wakes, finds its entry, leaves</text>
  <rect class="n" x="600" y="206" width="205" height="56" rx="4"/>
  <text class="b" x="612" y="228">core 3, in wfe</text>
  <text class="s" x="612" y="248">wakes, finds 0, sleeps again</text>
  <path class="lnr" d="M520,180 L560,180 L560,154 L598,154" marker-end="url(#ar)"/>
  <path class="lnr" d="M560,180 L560,234 L598,234" marker-end="url(#ar)"/>
  <text class="t s" x="537" y="172">2. sev</text>
  <text class="s" x="20" y="290">3. Each waiting core rereads its own word; the one whose word now holds an address jumps there, with x0 = 0.</text>
  <text class="s" x="20" y="306">The library releases the cores in turn. Here core 1 has gone and core 2 is next. Caches are off on both sides.</text>
</svg>
