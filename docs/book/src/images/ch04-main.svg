<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b03a2e"/></marker></defs>
  <style>
    .k { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .y { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .u { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .g { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .n { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .w { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .d { fill: #ffffff; stroke: #666666; stroke-width: 1; stroke-dasharray: 4 3; }
    .ln { fill: none; stroke: #333333; stroke-width: 1.3; }
    .dl { fill: none; stroke: #666666; stroke-width: 1; stroke-dasharray: 4 3; }
    .lnr { fill: none; stroke: #b03a2e; stroke-width: 1.6; }
    .t { text-anchor: middle; }
    .e { text-anchor: end; }
    .b { font-weight: bold; }
    .s { font-size: 11px; fill: #444444; }
    .m { font-family: DejaVu Sans Mono, monospace; font-size: 11px; }
    .r { fill: #b03a2e; font-weight: bold; }
  </style>
  <rect width="820" height="400" fill="#ffffff"/>
  <text class="b" x="20" y="24">What it knows from</text>
  <text class="b" x="320" y="24">main()</text>
  <text class="b" x="600" y="24">What the kernel and drivers get</text>
  <rect class="k" x="20" y="40" width="240" height="68" rx="4"/>
  <text class="b" x="32" y="62">The firmware, by mailbox</text>
  <text class="s" x="32" y="80">revision, ARM clock, GPU RAM,</text>
  <text class="s" x="32" y="94">serial, MAC address</text>
  <path class="ln" d="M260,74 L318,74" marker-end="url(#a)"/>
  <rect class="y" x="20" y="122" width="240" height="68" rx="4"/>
  <text class="b" x="32" y="144">The board crate</text>
  <text class="s" x="32" y="162">GIC, UART and PM addresses, spin</text>
  <text class="s" x="32" y="176">table, 4 CPUs, timer PPI 27</text>
  <path class="ln" d="M260,156 L318,156" marker-end="url(#a)"/>
  <rect class="g" x="20" y="204" width="240" height="68" rx="4"/>
  <text class="b" x="32" y="226">The device tree</text>
  <text class="s" x="32" y="244">the SD card controller's</text>
  <text class="s" x="32" y="258">DMA window</text>
  <path class="ln" d="M260,238 L318,238" marker-end="url(#a)"/>
  <rect class="u" x="20" y="286" width="240" height="68" rx="4"/>
  <text class="b" x="32" y="308">The build file</text>
  <text class="s" x="32" y="326">startup's options: -v, -D, -W</text>
  <path class="ln" d="M260,320 L318,320" marker-end="url(#a)"/>
  <rect class="n" x="320" y="40" width="190" height="314" rx="4"/>
  <text class="t b" x="415" y="70">startup-bcm2711-rpi4</text>
  <text class="t s" x="415" y="88">its board.rs calls the library</text>
  <text class="t m" x="415" y="118">init_debug()</text>
  <text class="t m" x="415" y="143">init_smp()</text>
  <text class="t m" x="415" y="168">init_ram()</text>
  <text class="t m" x="415" y="193">init_mmu()</text>
  <text class="t m" x="415" y="218">gic_v2::init(), init_msi()</text>
  <text class="t m" x="415" y="243">init_qtime()</text>
  <text class="t m" x="415" y="268">init_boot_cpu()</text>
  <text class="t m" x="415" y="293">init_hwinfo()</text>
  <text class="t m" x="415" y="318">boot()</text>
  <rect class="w" x="600" y="40" width="200" height="54" rx="4"/>
  <text class="m b" x="612" y="62">intrinfo, callouts</text>
  <text class="s" x="612" y="80">interrupts, debug UART, reboot</text>
  <path class="ln" d="M510,67 L598,67" marker-end="url(#a)"/>
  <rect class="w" x="600" y="106" width="200" height="54" rx="4"/>
  <text class="m b" x="612" y="128">asinfo</text>
  <text class="s" x="612" y="146">the RAM, vcram, below1G</text>
  <path class="ln" d="M510,133 L598,133" marker-end="url(#a)"/>
  <rect class="w" x="600" y="172" width="200" height="54" rx="4"/>
  <text class="m b" x="612" y="194">cpuinfo, qtime</text>
  <text class="s" x="612" y="212">the CPUs, their speed, the tick</text>
  <path class="ln" d="M510,199 L598,199" marker-end="url(#a)"/>
  <rect class="w" x="600" y="238" width="200" height="54" rx="4"/>
  <text class="m b" x="612" y="260">typed_strings</text>
  <text class="s" x="612" y="278">what uname and confstr() report</text>
  <path class="ln" d="M510,265 L598,265" marker-end="url(#a)"/>
  <rect class="w" x="600" y="304" width="200" height="54" rx="4"/>
  <text class="m b" x="612" y="326">hwinfo</text>
  <text class="s" x="612" y="344">genet, wdog, bcm2711-sdmmc</text>
  <path class="ln" d="M510,331 L598,331" marker-end="url(#a)"/>
  <text class="s" x="20" y="384">The right-hand column is the system page: section names on top, in bold. The GIC and the MSI controller both add to intrinfo.</text>
</svg>
