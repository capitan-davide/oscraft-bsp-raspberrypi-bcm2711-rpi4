<svg xmlns="http://www.w3.org/2000/svg" width="820" height="320" viewBox="0 0 820 320" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b03a2e"/></marker></defs>
  <style>
    .k { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .y { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .u { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .g { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .n { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .w { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .d { fill: #ffffff; stroke: #666666; stroke-width: 1; stroke-dasharray: 4 3; }
    .ln { fill: none; stroke: #333333; stroke-width: 1.3; }
    .dl { fill: none; stroke: #666666; stroke-width: 1; stroke-dasharray: 4 3; }
    .lnr { fill: none; stroke: #b03a2e; stroke-width: 1.6; }
    .t { text-anchor: middle; }
    .e { text-anchor: end; }
    .b { font-weight: bold; }
    .s { font-size: 11px; fill: #444444; }
    .m { font-family: DejaVu Sans Mono, monospace; font-size: 11px; }
    .r { fill: #b03a2e; font-weight: bold; }
  </style>
  <rect width="820" height="320" fill="#ffffff"/>
  <text class="t b" x="110" y="24">Pins on the header</text>
  <text class="t b" x="410" y="24">GPIO function registers</text>
  <text class="t s" x="410" y="38">set by the firmware from config.txt</text>
  <text class="t b" x="705" y="24">Inside the BCM2711</text>
  <rect class="y" x="30" y="80" width="160" height="74" rx="4"/>
  <text class="t b" x="110" y="112">GPIO 14, 15</text>
  <text class="t s" x="110" y="132">the console pins</text>
  <rect class="y" x="30" y="206" width="160" height="60" rx="4"/>
  <text class="t b" x="110" y="232">GPIO 4, 5</text>
  <text class="t s" x="110" y="250">only with the overlay</text>
  <rect class="n" x="290" y="46" width="240" height="224" rx="4"/>
  <rect class="k" x="610" y="50" width="190" height="56" rx="4"/>
  <text class="t b" x="705" y="72">mini-UART (UART1)</text>
  <text class="t m" x="705" y="92">0xfe215000</text>
  <rect class="k" x="610" y="118" width="190" height="56" rx="4"/>
  <text class="t b" x="705" y="140">UART0, PL011</text>
  <text class="t m" x="705" y="160">0xfe201000</text>
  <rect class="k" x="610" y="208" width="190" height="56" rx="4"/>
  <text class="t b" x="705" y="230">UART3, PL011</text>
  <text class="t m" x="705" y="250">0xfe201600</text>
  <path class="ln" d="M190,117 L250,117"/>
  <path class="ln" d="M250,117 L250,78 L608,78" marker-end="url(#a)"/>
  <text class="m" x="300" y="70">enable_uart=1</text>
  <path class="dl" d="M250,117 L250,146 L608,146" marker-end="url(#a)"/>
  <text class="m" x="300" y="138">dtoverlay=disable-bt</text>
  <path class="ln" d="M190,236 L608,236" marker-end="url(#a)"/>
  <text class="m" x="300" y="228">dtoverlay=uart3</text>
  <text class="s" x="30" y="292">By default the console pins reach the mini-UART (solid), and UART0 serves the Bluetooth chip.</text>
  <text class="s" x="30" y="308">disable-bt gives the console pins to UART0 instead (dashed).</text>
</svg>
