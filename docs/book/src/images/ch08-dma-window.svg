<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330" viewBox="0 0 820 330" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b03a2e"/></marker></defs>
  <style>
    .k { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .y { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .u { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .g { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .n { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .w { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .d { fill: #ffffff; stroke: #666666; stroke-width: 1; stroke-dasharray: 4 3; }
    .ln { fill: none; stroke: #333333; stroke-width: 1.3; }
    .dl { fill: none; stroke: #666666; stroke-width: 1; stroke-dasharray: 4 3; }
    .lnr { fill: none; stroke: #b03a2e; stroke-width: 1.6; }
    .t { text-anchor: middle; }
    .e { text-anchor: end; }
    .b { font-weight: bold; }
    .s { font-size: 11px; fill: #444444; }
    .m { font-family: DejaVu Sans Mono, monospace; font-size: 11px; }
    .r { fill: #b03a2e; font-weight: bold; }
  </style>
  <rect width="820" height="330" fill="#ffffff"/>
  <text class="t b" x="170" y="24">What the SD controller writes</text>
  <text class="s" x="80" y="40">addresses on its bus</text>
  <text class="t b" x="620" y="24">Where the data lands</text>
  <text class="s" x="540" y="40">physical addresses</text>
  <rect class="w" x="80" y="52" width="190" height="40"/>
  <text class="t s" x="175" y="76">not reachable</text>
  <rect class="g" x="80" y="92" width="190" height="130"/>
  <text class="t b" x="175" y="150">DMA window</text>
  <text class="t s" x="175" y="170">1 GB</text>
  <rect class="w" x="80" y="222" width="190" height="40"/>
  <text class="t s" x="175" y="246">not reachable</text>
  <text class="m e" x="72" y="96">0xffffffff</text>
  <text class="m e" x="72" y="226">0xc0000000</text>
  <rect class="k" x="540" y="52" width="190" height="92"/>
  <text class="t b" x="635" y="102">RAM above 1 GB</text>
  <rect class="u" x="540" y="144" width="190" height="40"/>
  <text class="t b" x="635" y="168">vcram</text>
  <rect class="g" x="540" y="184" width="190" height="78"/>
  <text class="t b" x="635" y="220">below1G</text>
  <text class="t s" x="635" y="238">what drivers ask for</text>
  <text class="m e" x="532" y="148">1 GB</text>
  <text class="m e" x="532" y="266">0</text>
  <path class="dl" d="M270,92 L490,144"/>
  <path class="ln" d="M270,222 L490,262" marker-end="url(#a)"/>
  <text class="t s" x="405" y="196">bus 0xc0000000 + n is physical n</text>
  <text class="s" x="20" y="296">The device tree gives this in dma-ranges, on the controller's parent bus; init_hwinfo() reads it and stores the window, base and size.</text>
  <text class="s" x="20" y="312">The window covers exactly the first gigabyte, which is why the driver takes its memory from below1G.</text>
</svg>
