<svg xmlns="http://www.w3.org/2000/svg" width="820" height="250" viewBox="0 0 820 250" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b03a2e"/></marker></defs>
  <style>
    .k { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .y { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .u { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .g { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .n { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .w { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .d { fill: #ffffff; stroke: #666666; stroke-width: 1; stroke-dasharray: 4 3; }
    .ln { fill: none; stroke: #333333; stroke-width: 1.3; }
    .dl { fill: none; stroke: #666666; stroke-width: 1; stroke-dasharray: 4 3; }
    .lnr { fill: none; stroke: #b03a2e; stroke-width: 1.6; }
    .t { text-anchor: middle; }
    .e { text-anchor: end; }
    .b { font-weight: bold; }
    .s { font-size: 11px; fill: #444444; }
    .m { font-family: DejaVu Sans Mono, monospace; font-size: 11px; }
    .r { fill: #b03a2e; font-weight: bold; }
  </style>
  <rect width="820" height="250" fill="#ffffff"/>
  <text class="b" x="20" y="24">The revision code of QEMU's raspi4b, 0x00b03115</text>
  <text class="t s" x="117.5" y="48">31-24</text>
  <rect class="n" x="20" y="56" width="195.0" height="38"/>
  <text class="t m" x="117.5" y="80">00000000</text>
  <text class="t m" x="117.5" y="114">N O Q uuu W u</text>
  <text class="t s" x="227.1875" y="48">23</text>
  <rect class="n" x="215.0" y="56" width="24.375" height="38"/>
  <text class="t m" x="227.1875" y="80">1</text>
  <text class="t m" x="227.1875" y="114">F</text>
  <text class="t s" x="227.1875" y="140">new style</text>
  <text class="t s" x="275.9375" y="48">22-20</text>
  <rect class="y" x="239.375" y="56" width="73.125" height="38"/>
  <text class="t m" x="275.9375" y="80">011</text>
  <text class="t m" x="275.9375" y="114">MMM</text>
  <text class="t s" x="275.9375" y="140">RAM</text>
  <text class="t m" x="275.9375" y="160">2048 MB</text>
  <text class="t s" x="361.25" y="48">19-16</text>
  <rect class="k" x="312.5" y="56" width="97.5" height="38"/>
  <text class="t m" x="361.25" y="80">0000</text>
  <text class="t m" x="361.25" y="114">CCCC</text>
  <text class="t s" x="361.25" y="140">maker</text>
  <text class="t m" x="361.25" y="160">Sony UK</text>
  <text class="t s" x="458.75" y="48">15-12</text>
  <rect class="g" x="410.0" y="56" width="97.5" height="38"/>
  <text class="t m" x="458.75" y="80">0011</text>
  <text class="t m" x="458.75" y="114">PPPP</text>
  <text class="t s" x="458.75" y="140">processor</text>
  <text class="t m" x="458.75" y="160">BCM2711</text>
  <text class="t s" x="605.0" y="48">11-4</text>
  <rect class="u" x="507.5" y="56" width="195.0" height="38"/>
  <text class="t m" x="605.0" y="80">00010001</text>
  <text class="t m" x="605.0" y="114">TTTTTTTT</text>
  <text class="t s" x="605.0" y="140">board type</text>
  <text class="t b" x="605.0" y="160">RaspberryPi4B</text>
  <text class="t s" x="751.25" y="48">3-0</text>
  <rect class="n" x="702.5" y="56" width="97.5" height="38"/>
  <text class="t m" x="751.25" y="80">0101</text>
  <text class="t m" x="751.25" y="114">RRRR</text>
  <text class="t s" x="751.25" y="140">revision</text>
  <text class="s" x="20" y="196">Bits 31-24 hold flags and unused bits: revision.rs does not read them, and F only says the code is in this new format.</text>
  <text class="s" x="20" y="212">MMM indexes the sizes 256 MB to 8 GB, so 3 is 2048 MB. An 8 GB Pi 4 B reports 0x00d03114, with MMM 5.</text>
</svg>
