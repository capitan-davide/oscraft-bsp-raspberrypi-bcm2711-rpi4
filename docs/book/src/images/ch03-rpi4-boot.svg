<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker></defs>
  <style>
    .k { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .y { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .ln { fill: none; stroke: #333333; stroke-width: 1.2; }
    .t { text-anchor: middle; }
    .b { font-weight: bold; }
    .s { font-size: 11px; fill: #444444; }
  </style>
  <rect width="820" height="360" fill="#ffffff"/>
  <text class="b" x="20" y="26">Raspberry Pi 4</text>
  <rect class="n" x="20" y="40" width="170" height="80" rx="6"/>
  <text class="t b" x="105" y="62">VideoCore GPU</text>
  <text class="t s" x="105" y="80">boots first: start4.elf</text>
  <text class="t s" x="105" y="94">reads config.txt, loads</text>
  <text class="t s" x="105" y="108">the image and the DTB</text>
  <rect class="n" x="230" y="40" width="170" height="80" rx="6"/>
  <text class="t b" x="315" y="62">armstub8</text>
  <text class="t s" x="315" y="80">at 0x0, on the ARM cores:</text>
  <text class="t s" x="315" y="94">EL3 to EL2; core 0 jumps,</text>
  <text class="t s" x="315" y="108">cores 1-3 poll 0xd8 + 8n</text>
  <text class="b" x="20" y="166">QEMU raspi4b</text>
  <rect class="n" x="20" y="180" width="170" height="80" rx="6"/>
  <text class="t b" x="105" y="202">QEMU's loader</text>
  <text class="t s" x="105" y="220">puts the image at 0x80000</text>
  <text class="t s" x="105" y="234">and the DTB at 0x1f000000</text>
  <rect class="n" x="230" y="180" width="170" height="80" rx="6"/>
  <text class="t b" x="315" y="202">fwstub</text>
  <text class="t s" x="315" y="220">does what armstub8 does:</text>
  <text class="t s" x="315" y="234">same EL, registers and</text>
  <text class="t s" x="315" y="248">spin table</text>
  <path class="ln" d="M190,80 L228,80" marker-end="url(#a)"/>
  <path class="ln" d="M190,220 L228,220" marker-end="url(#a)"/>
  <!-- common part -->
  <rect class="y" x="460" y="110" width="150" height="80" rx="6"/>
  <text class="t b" x="535" y="134">core 0 at EL2</text>
  <text class="t s" x="535" y="152">pc = 0x80000</text>
  <text class="t s" x="535" y="166">x0 = the DTB</text>
  <text class="t s" x="535" y="180">MMU off</text>
  <path class="ln" d="M400,80 L458,140" marker-end="url(#a)"/>
  <path class="ln" d="M400,220 L458,160" marker-end="url(#a)"/>
  <rect class="k" x="650" y="110" width="150" height="80" rx="6"/>
  <text class="t b" x="725" y="134">startup</text>
  <text class="t s" x="725" y="152">startup-bcm2711-rpi4,</text>
  <text class="t s" x="725" y="166">through the image's</text>
  <text class="t s" x="725" y="180">boot prefix</text>
  <path class="ln" d="M610,150 L648,150" marker-end="url(#a)"/>
  <text class="s" x="20" y="300">From here on the two are the same: the same image, the same startup, the same handoff.</text>
  <text class="s" x="20" y="314">Only the hardware behind the registers differs: the board's, or QEMU's models of it.</text>
</svg>
