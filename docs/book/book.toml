[book]
title = "The Raspberry Pi 4 BSP"
description = "How the OsCraft board support package boots QNX OS 8.0 on the Raspberry Pi 4 with a startup written in Rust."
authors = ["The OsCraft authors"]
language = "en"
src = "src"

[build]
build-dir = "../../build/book/bsp"

[output.html]
git-repository-url = "https://github.com/capitan-davide/oscraft-bsp-raspberrypi-bcm2711-rpi4"
default-theme = "light"
preferred-dark-theme = "navy"
