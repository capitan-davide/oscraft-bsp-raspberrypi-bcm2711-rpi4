[workspace]
resolver = "3"
members = ["oscraft-startup", "startup-bcm2711-rpi4"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[profile.dev]
panic = "abort"
# Startup runs with the MMU and caches off: keep the code small and fast
# even in a debug build.
opt-level = "s"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
debug = true
