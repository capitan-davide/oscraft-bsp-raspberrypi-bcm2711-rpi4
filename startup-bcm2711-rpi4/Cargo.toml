[package]
name = "startup-bcm2711-rpi4"
description = "Startup for the Raspberry Pi 4 (BCM2711), compatible with QNX OS 8.0"
version.workspace = true
edition.workspace = true
license.workspace = true

# A static library: the Makefile partially links it (ld -r) into the
# relocatable object mkifs expects, and mkifs links that at the image's
# address.
[lib]
crate-type = ["staticlib"]

[dependencies]
# OsCraft's startup library (startup/ in OsCraft's repository), pinned.
oscraft-startup = { git = "ssh://git@github.com/capitan-davide/oscraft.git", rev = "4db85f5649a207a4940d62ea6fdfce1322f4cdd8" }
